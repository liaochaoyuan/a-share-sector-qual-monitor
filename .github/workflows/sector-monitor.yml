"on":
  # 每 10 分钟触发一次（标准 cron，使用 UTC 时区）。
  # 北京时间 = UTC+8，所以全天候都会跑；但非交易时段 analyzer 自动走 snapshot
  # 快速退出（不更新状态、不推送），不会误报。交易时段则每 10 分钟评估一次。
  schedule:
    - cron: "*/10 * * * *"
  # 允许在 Actions 页面手动触发，方便调试
  workflow_dispatch: {}

# 同一时间只跑一个 job，避免并发写状态冲突
concurrency:
  group: sector-monitor
  cancel-in-progress: false

# 允许 job 把状态文件 commit 回仓库（跨 job 持久化「连续达标天数」）
permissions:
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run sector qualification analyzer (single pass)
        env:
          # Server酱 SENDKEY 通过仓库 Secrets 注入，永远不会出现在代码/日志里
          SERVERCHAN_SENDKEY: ${{ secrets.SERVERCHAN_SENDKEY }}
        run: python sector_qualification_analyzer.py

      - name: Persist state (commit qualification_state.json if changed)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          if [[ -n "$(git status --porcelain qualification_state.json)" ]]; then
            git add qualification_state.json
            git commit -m "chore: auto-persist qualification state [skip ci]"
            git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git"
            echo "STATE_COMMITTED"
          else
            echo "STATE_UNCHANGED"
          fi
