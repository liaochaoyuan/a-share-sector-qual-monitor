name: A股 市场情绪/板块二次监控 (5分钟级·冗余通道)

on:
  # 与 breakout-monitor 同频（每 5 分钟，交易日 09:25-15:00 = UTC 01:25-07:00）。
  # 脚本内部再做北京时间交易时段兜底判断。本工作流使用独立状态文件 sector_state.json，
  # 既避免与 breakout-monitor 抢同一文件造成 git 提交冲突，又能作为第二路推送冗余。
  schedule:
    # 与 breakout-monitor 错开 2 分钟触发，避免两个 job 同一分钟并发 git push 抢锁
    - cron: "2-59/5 1-7 * * 1-5"
  # 允许在 Actions 页面手动触发，方便调试
  workflow_dispatch: {}

# 独立并发组，不与 breakout-monitor 互斥
concurrency:
  group: sector-monitor
  cancel-in-progress: false

# 允许 job 把状态文件 commit 回仓库（独立状态，跨 cron 调用保持去重）
permissions:
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run sector monitor (single pass, independent state)
        env:
          # Server酱 SENDKEY 通过仓库 Secrets 注入，永远不会出现在代码/日志里
          SERVERCHAN_SENDKEY: ${{ secrets.SERVERCHAN_SENDKEY }}
        run: python3 breakout_monitor.py --once --state sector_state.json

      - name: Persist state (commit sector_state.json if changed)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          FILE=sector_state.json
          if [[ -n "$(git status --porcelain $FILE)" ]]; then
            git add "$FILE"
            git commit -m "chore: auto-persist sector state [skip ci]"
            for i in 1 2 3; do
              git pull --rebase origin main || true
              if git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git"; then
                echo "STATE_COMMITTED"; break
              fi
              sleep 3
            done
          else
            echo "STATE_UNCHANGED"
          fi
